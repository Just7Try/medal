<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>وسام الالتزام برفع الواجبات - مدارس الأقصى الحديثة</title>
<style>
:root{--b:#0562B5;--d:#0B2F73;--p:#C2186B;--g:#F5C542;--wa:#25D366}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tajawal,'Segoe UI',Arial,sans-serif;background:linear-gradient(160deg,#0B2F73,#0562B5);color:#123;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.card{width:100%;max-width:420px;min-height:620px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 14px 40px #0006;position:relative;display:flex;flex-direction:column}
.bar{background:var(--d);color:#fff;padding:12px 16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;font-size:14px}
.bar img{height:34px;background:#fff;border-radius:8px;padding:2px 6px}
.body{flex:1;padding:20px 18px;overflow:auto;text-align:center;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
.hero{background:linear-gradient(160deg,#0562B5,var(--d));color:#fff;border-radius:20px;padding:24px 14px;margin-bottom:14px}
.hero h2{margin:6px 0;color:var(--g);font-size:20px}.hero .n{font-size:21px;font-weight:800;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.st{background:#f2f7ff;border-radius:14px;padding:12px}.st b{display:block;font-size:26px;color:var(--b)}
.score{background:var(--g);border-radius:14px;padding:12px;margin-top:12px;font-weight:800;color:var(--d);font-size:19px}
.gift{border-radius:18px;padding:14px;margin:10px 0;color:#fff;text-align:center}
.gem{background:linear-gradient(135deg,#4285F4,#9B72CB,#D96570)}.can{background:linear-gradient(135deg,#00C4CC,#7D2AE8)}
.box{font-size:92px;cursor:pointer;animation:bn 1s infinite alternate;user-select:none}@keyframes bn{to{transform:translateY(-12px)}}
.btn{display:block;background:var(--p);color:#fff;border-radius:14px;padding:13px;font-weight:800;border:0;width:100%;cursor:pointer;margin-top:12px;font:inherit;font-size:15px}
.btn.wa{background:var(--wa);color:#fff}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:2px solid #cbd6e6;font:inherit;font-size:15px;text-align:left;direction:ltr;margin-top:8px;outline:none}
.inp:focus{border-color:var(--p)}
.err{color:#c0392b;font-size:13px;margin-top:6px;display:none}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;animation:fall 3s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(680px) rotate(540deg)}}
.dots{display:flex;gap:6px;justify-content:center;padding:10px}.dots span{width:8px;height:8px;border-radius:50%;background:#cde}.dots .on{background:var(--p)}
</style></head><body>

function gift(){
  conf();const g=gifts(cur);
  show(`<div class="body"><h3 style="color:var(--d);margin:2px 0 8px">هديتك 🎉</h3>${g.map(x=>`<div class="gift ${x.c}"><div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">${x.i=='GEM'?GEM_LOGO:CAN_LOGO}<b>${x.n}</b></div></div>`).join('')}<div class="gift" style="background:#fff8e1;color:#4a3500;border:2px dashed #C2186B;text-align:center"><div style="font-size:22px">📧</div><b>لاستلام وتفعيل هديتك أرسل إيميلك إلى وحدة الحاسوب</b><input id="em" class="inp" type="email" placeholder="example@gmail.com"><div id="er" class="err">يرجى إدخال بريد إلكتروني صحيح</div><button class="btn wa" onclick="sendWA()">💬 إرسال إلى وحدة الحاسوب عبر واتساب</button></div></div>${dots(3)}`,'استلام الهدية');
}
function sendWA(){
  const em=($('em').value||'').trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){$('er').style.display='block';return}
  const g=gifts(cur).map(x=>x.n).join(' + ');
  const msg=`السلام عليكم وحدة الحاسوب - مدارس الأقصى الحديثة\nأرغب بتفعيل هدية وسام الالتزام برفع الواجبات:\n• المعلم: ${cur.name}\n• رقم الميدالية: ${cur.id}\n• الهدية: ${g}\n• البريد الإلكتروني: ${em}`;
  localStorage[key(cur)]=JSON.stringify({date:new Date().toLocaleDateString('ar'),email:em});
  window.open('https://wa.me/'+IT_WA+'?text='+encodeURIComponent(msg),'_blank');
  done(false);
}
function done(again){
  let info='';try{const d=JSON.parse(localStorage[key(cur)]||'{}');if(d.date)info=`تاريخ الطلب: ${d.date}<br>الإيميل المرسل: <b dir="ltr">${d.email||''}</b>`}catch(e){}
  show(`<div class="body"><div class="box">✅</div><h3>${again?'تم إرسال طلب الهدية مسبقاً':'تم توجيه طلبك إلى وحدة الحاسوب'}</h3><p>${info||'سيتم تفعيل اشتراكك على بريدك الإلكتروني قريباً.'}</p><button class="btn" style="background:var(--b)" onclick="localStorage.removeItem(key(cur));gift()">تعديل الإيميل أو إعادة الإرسال</button></div>`,'تم الاستلام');
}
function invalid(){
  show(`<div class="body"><div class="box">⚠️</div><h3>رابط غير مكتمل أو ميدالية غير صالحة</h3><p>امسح الباركود الموجود خلف الميدالية بكاميرا الهاتف لفتح صفحة التكريم الخاصة بك.</p></div>`,'تنبيه');
}
welcome();
</script></body></html>
